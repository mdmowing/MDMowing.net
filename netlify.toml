[build]
  publish = "."

# ─── Redirects ───────────────────────────────────────────────────────────────
# Any request hitting the Netlify preview subdomain should 301 to the matching
# path on the primary domain. Listed first so no later rule can catch it.
[[redirects]]
  from = "https://md-mowing.netlify.app/*"
  to = "https://mdmowing.net/:splat"
  status = 301
  force = true

# ─── Security headers ────────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
