<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&display=swap">
</head>
<body>
<template id="hook-template">
<div data-composition-id="hook" data-width="1080" data-height="1920">

  <!-- Grid floor -->
  <div class="grid-floor"></div>
  <!-- Vignette -->
  <div class="vignette"></div>

  <!-- Three impact words -->
  <div class="stage">
    <div class="word" id="w-the">THE</div>
    <div class="word" id="w-full">FULL</div>
    <div class="word hero" id="w-service">SERVICE.</div>
  </div>

  <style>
    [data-composition-id="hook"] {
      position: relative;
      width: 100%;
      height: 100%;
      background: #080d08;
      overflow: hidden;
    }
    [data-composition-id="hook"] .grid-floor {
      position: absolute;
      inset: 0;
      transform: perspective(900px) rotateX(60deg) translateY(30%);
      background:
        repeating-linear-gradient(0deg,  rgba(34,197,94,0.04) 0 1px, rgba(0,0,0,0) 1px 90px),
        repeating-linear-gradient(90deg, rgba(34,197,94,0.04) 0 1px, rgba(0,0,0,0) 1px 90px);
      pointer-events: none;
    }
    [data-composition-id="hook"] .vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, rgba(0,0,0,0) 25%, #080d08 90%);
      pointer-events: none;
      z-index: 10;
    }
    [data-composition-id="hook"] .stage {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
      z-index: 5;
    }
    [data-composition-id="hook"] .word {
      font-family: 'Montserrat', sans-serif;
      font-weight: 900;
      font-size: 200px;
      line-height: 0.9;
      letter-spacing: -0.02em;
      background: linear-gradient(180deg, #ffffff 0%, #aaaaaa 60%, #cccccc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: rgba(0,0,0,0);
      color: transparent;
      text-align: center;
      will-change: transform, opacity;
    }
    [data-composition-id="hook"] .word.hero {
      font-size: 210px;
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      const SLOT = 2.5;
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // "THE" crashes in from top
      tl.from('#w-the', { y: -180, opacity: 0, duration: 0.33, ease: 'expo.out' }, 0.1);
      // "FULL" crashes in from bottom
      tl.from('#w-full', { y: 180, opacity: 0, duration: 0.33, ease: 'expo.out' }, 0.4);
      // "SERVICE." crashes in from left
      tl.from('#w-service', { x: -160, opacity: 0, duration: 0.33, ease: 'expo.out' }, 0.7);

      // Hero scale-through on "SERVICE." — camera dolly
      tl.to('#w-service', { scale: 6, opacity: 0, duration: 0.75, ease: 'power2.in' }, 1.75);
      // "THE" and "FULL" fade as the hero scales
      tl.to('#w-the',   { opacity: 0, duration: 0.4, ease: 'power2.in' }, 1.85);
      tl.to('#w-full',  { opacity: 0, duration: 0.4, ease: 'power2.in' }, 1.95);

      // Anchor — keeps composition alive for full slot
      tl.to({}, { duration: SLOT }, 0);

      window.__timelines['hook'] = tl;
    })();
  </script>
</div>
</template>
</body>
</html>
