<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900&display=swap">
</head>
<body>
<template id="blow-template">
<div data-composition-id="blow" data-width="1080" data-height="1920">

  <!-- Footage placeholder -->
  <div class="footage-placeholder"></div>
  <!-- TO ADD FOOTAGE: remove .footage-placeholder div, add: video#clip-blow src="../assets/clip-blow.mp4" data-start="0" data-duration="3.5" data-track-index="0" muted playsinline style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;" -->

  <div class="footage-overlay"></div>
  <div class="vignette"></div>

  <div class="impact-wrap">
    <div class="impact-word" id="blow-word">BLOW.</div>
    <!-- Three dots — visual callback to the rule of threes -->
    <div class="dots-row">
      <div class="dot" id="d1"></div>
      <div class="dot" id="d2"></div>
      <div class="dot" id="d3"></div>
    </div>
  </div>

  <style>
    [data-composition-id="blow"] {
      position: relative;
      width: 100%;
      height: 100%;
      background: #080d08;
      overflow: hidden;
    }
    [data-composition-id="blow"] .footage-placeholder {
      position: absolute;
      inset: 0;
      background: linear-gradient(140deg, #0a180a 0%, #060d06 50%, #101d10 100%);
    }
    [data-composition-id="blow"] .footage-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.35);
      z-index: 1;
    }
    [data-composition-id="blow"] .vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, rgba(0,0,0,0) 30%, #000 95%);
      pointer-events: none;
      z-index: 2;
    }
    [data-composition-id="blow"] .impact-wrap {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 5;
    }
    [data-composition-id="blow"] .impact-word {
      font-family: 'Montserrat', sans-serif;
      font-weight: 900;
      font-size: 280px;
      line-height: 1;
      letter-spacing: -0.03em;
      color: #22c55e;
      text-shadow:
        0 0 60px rgba(34,197,94,0.6),
        0 0 120px rgba(34,197,94,0.3);
      will-change: transform, opacity;
    }
    [data-composition-id="blow"] .dots-row {
      display: flex;
      gap: 28px;
      margin-top: 36px;
    }
    [data-composition-id="blow"] .dot {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 14px rgba(34,197,94,0.7);
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      const SLOT = 3.5;
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Word drops from top with a bounce
      tl.from('#blow-word', { y: -240, opacity: 0, duration: 0.4, ease: 'back.out(1.2)' }, 0.15);
      // Three dots appear with stagger
      tl.from('#d1', { scale: 0, opacity: 0, duration: 0.2, ease: 'back.out(2)' }, 0.65);
      tl.from('#d2', { scale: 0, opacity: 0, duration: 0.2, ease: 'back.out(2)' }, 0.73);
      tl.from('#d3', { scale: 0, opacity: 0, duration: 0.2, ease: 'back.out(2)' }, 0.81);
      // Breathing pulse
      tl.to('#blow-word', { scale: 1.03, duration: 1.0, ease: 'sine.inOut', yoyo: true, repeat: 2 }, 1.0);

      tl.to({}, { duration: SLOT }, 0);
      window.__timelines['blow'] = tl;
    })();
  </script>
</div>
</template>
</body>
</html>
