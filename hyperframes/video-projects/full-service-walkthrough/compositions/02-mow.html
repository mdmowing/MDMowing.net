<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900&display=swap">
</head>
<body>
<template id="mow-template">
<div data-composition-id="mow" data-width="1080" data-height="1920">

  <video id="clip-mow" src="../assets/clip-mow.mp4"
    data-start="0" data-duration="3.5" data-track-index="0"
    muted playsinline
    style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;"></video>

  <!-- Dark overlay for text readability -->
  <div class="footage-overlay"></div>
  <!-- Vignette -->
  <div class="vignette"></div>

  <!-- Impact word -->
  <div class="impact-wrap">
    <div class="impact-word" id="mow-word">MOW.</div>
    <div class="glow-bar"></div>
  </div>

  <style>
    [data-composition-id="mow"] {
      position: relative;
      width: 100%;
      height: 100%;
      background: #080d08;
      overflow: hidden;
    }
    [data-composition-id="mow"] .footage-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.35);
      z-index: 1;
    }
    [data-composition-id="mow"] .vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, rgba(0,0,0,0) 30%, #000 95%);
      pointer-events: none;
      z-index: 2;
    }
    [data-composition-id="mow"] .impact-wrap {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 5;
    }
    [data-composition-id="mow"] .impact-word {
      font-family: 'Montserrat', sans-serif;
      font-weight: 900;
      font-size: 280px;
      line-height: 1;
      letter-spacing: -0.03em;
      color: #22c55e;
      text-shadow:
        0 0 60px rgba(34,197,94,0.6),
        0 0 120px rgba(34,197,94,0.3);
      will-change: transform, opacity;
    }
    [data-composition-id="mow"] .glow-bar {
      width: 320px;
      height: 5px;
      background: #22c55e;
      box-shadow: 0 0 20px rgba(34,197,94,0.8);
      margin-top: 20px;
      transform-origin: left center;
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      const SLOT = 3.5;
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Impact word slams in from left with motion blur
      tl.from('#mow-word', { x: -320, opacity: 0, filter: 'blur(12px)', duration: 0.25, ease: 'expo.out' }, 0.15);
      // Glow bar slides in
      tl.from('.glow-bar', { scaleX: 0, opacity: 0, duration: 0.4, ease: 'power2.out' }, 0.45);
      // Subtle breathing pulse on the word
      tl.to('#mow-word', { scale: 1.03, duration: 1.0, ease: 'sine.inOut', yoyo: true, repeat: 2 }, 0.8);

      tl.to({}, { duration: SLOT }, 0);
      window.__timelines['mow'] = tl;
    })();
  </script>
</div>
</template>
</body>
</html>
