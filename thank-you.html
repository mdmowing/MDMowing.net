<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#1B3B2B" />
  <title>Thank you — MD Mowing</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='3' fill='%231B3B2B'/%3E%3Ctext x='50%25' y='53%25' text-anchor='middle' dominant-baseline='middle' font-family='Georgia' font-size='34' font-style='italic' fill='%23FBF9F5'%3Em%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #FBF9F5; --forest: #1B3B2B; --moss: #2F4A36; --sage: #6B7A5E; --stone: #8A847A;
      --hairline: #DAD4C8; --cedar: #8F5D2E; --cedar-dk: #7A4E26;
      --ff-serif: 'Playfair Display', Georgia, serif;
      --ff-sans: 'Inter', system-ui, -apple-system, sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--ff-sans);
      background: var(--bg);
      color: var(--forest);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    .nav {
      padding: 1.25rem clamp(1.5rem, 5vw, 5rem);
      border-bottom: 1px solid var(--hairline);
    }
    .brand {
      font-family: var(--ff-serif);
      font-weight: 500;
      font-size: 1.4rem;
      color: var(--forest);
    }
    .brand em { font-style: italic; color: var(--sage); font-weight: 400; }
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(3rem, 8vw, 6rem) clamp(1.5rem, 5vw, 5rem);
    }
    .ty {
      max-width: 640px;
      text-align: left;
    }
    .eyebrow {
      font-size: 0.72rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      font-weight: 500;
      color: var(--stone);
      display: block;
      margin-bottom: 1.5rem;
    }
    h1 {
      font-family: var(--ff-serif);
      font-weight: 400;
      font-size: clamp(2.5rem, 6vw, 4rem);
      line-height: 1.05;
      letter-spacing: -0.015em;
      color: var(--forest);
      margin-bottom: 1.75rem;
    }
    h1 em { font-style: italic; color: var(--moss); font-weight: 400; }
    .lede {
      font-size: 1.125rem;
      line-height: 1.7;
      color: var(--moss);
      margin-bottom: 2.5rem;
      max-width: 48ch;
    }
    .meta {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin-bottom: 2.5rem;
      padding-top: 1.75rem;
      border-top: 1px solid var(--hairline);
    }
    .meta-row {
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
    }
    .meta-label {
      font-size: 0.68rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--stone);
    }
    .meta a {
      font-size: 1.05rem;
      color: var(--forest);
      font-weight: 500;
      border-bottom: 1px solid var(--hairline);
      padding-bottom: 2px;
      align-self: flex-start;
    }
    .meta a:hover { border-bottom-color: var(--forest); }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.7rem;
      padding: 1rem 2rem;
      background: var(--cedar);
      color: var(--bg);
      font-size: 0.78rem;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      border: 1px solid var(--cedar);
      border-radius: 2px;
      transition: background .25s ease, border-color .25s ease;
    }
    .btn:hover { background: var(--cedar-dk); border-color: var(--cedar-dk); }
    .foot {
      padding: 1.5rem clamp(1.5rem, 5vw, 5rem);
      border-top: 1px solid var(--hairline);
      font-size: 0.78rem;
      color: var(--stone);
      text-align: center;
    }
  </style>
</head>
<body>
  <header class="nav">
    <a href="/" class="brand">MD <em>Mowing</em></a>
  </header>
  <main>
    <div class="ty">
      <span class="eyebrow">Request received</span>
      <h1>Thanks — we've got your <em>message.</em></h1>
      <p class="lede">We'll get back to you within 24 hours, usually much faster. If it's urgent or you'd rather talk it through, give us a call directly.</p>
      <div class="meta">
        <div class="meta-row">
          <span class="meta-label">Phone</span>
          <a href="tel:8477724803">(847) 772-4803</a>
        </div>
        <div class="meta-row">
          <span class="meta-label">Email</span>
          <a href="mailto:marcusdan@mdmowing.net">marcusdan@mdmowing.net</a>
        </div>
      </div>
      <a href="/" class="btn">Back to home</a>
    </div>
  </main>
  <footer class="foot">© <span id="y"></span> MD Mowing · Lake Forest, Illinois</footer>
  <script>document.getElementById('y').textContent = new Date().getFullYear();</script>
</body>
</html>
